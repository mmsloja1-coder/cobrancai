services:
  - type: web
    name: cobrancai
    env: static
    buildCommand: "echo 'Static site - no build needed'"
    staticPublishPath: ./agentguard-landing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "18"
    plan: free
    region: oregon
    autoDeploy: true